body:
  text: 另設啓請法座班首鳴引磬齊主上香禮拜已班首前行後師齊主又後至佛前師拈香維那舉讚戒定真香焚起衝天上齊主弟子虔誠爇在金爐放頃刻氤氳即遍滿十方昔日耶輸免難消災障香雲蓋三稱畢師云覺海虗空起娑婆業浪流若人登彼岸極樂有歸舟大衆念佛至靈前站定念心經一卷往生呪三遍畢舉讚或說後文皆可法王利物悲智洪深普遍十方冥陽靡隔今蒙齊主某恭為某屆逢某之期特請山僧登座依憑教法作三時繫念佛事乃爾亡靈遭此勝緣自宜嚴肅威儀來臨座下恭聆妙法一心受度大衆念佛上座其座對靈前供接引佛一尊香華供養維那舉讚爐香乍爇法界蒙熏諸佛海會悉遙聞隨處結祥雲誠意方殷諸佛現全身雲來集三稱畢師拈香云此一瓣香根蟠劫外枝播塵寰不經天地以生成豈屬陰陽而造化爇向爐中專伸供養常住三寶剎海萬靈極樂導師阿彌陀佛觀音勢至清淨海衆悉仗真香普同供養香雲蓋三稱畢師與大衆齊座下第一時南無蓮池海會佛菩薩三稱此係維那師舉佛說阿彌陀經如是我聞一時佛在舍衛國祇樹給孤獨園與大比丘僧千二百五十人俱皆是大阿羅漢衆所知識長老舍利弗摩訶目犍連摩訶迦葉摩訶迦旃延摩訶俱絺羅離婆多周利槃陀伽難陀阿難陀羅睺羅憍梵波提賓頭盧頗羅墮迦留陀夷摩訶劫賓那薄拘羅阿㝹樓馱如是等諸大弟子并諸菩薩摩訶薩文殊師利法王子阿逸多菩薩乾陀訶提菩薩常精進菩薩與如是等諸大菩薩及釋提桓因等無量諸天大衆俱爾時佛告長老舍利弗從是西方過十萬億佛土有世界名曰極樂其土有佛號阿彌陀今現在說法舍利弗彼土何故名為極樂其國衆生無有衆苦但受諸樂故名極樂又舍利弗極樂國土七重欄楯七重羅網七重行樹皆是四寶周匝圍繞是故彼國名為極樂又舍利弗極樂國土有七寶池八功德水充滿其中池底純以金沙布地四邊階道金銀琉璃玻瓈合成上有樓閣亦以金銀琉璃玻瓈𤥭璖赤珠碼瑙而嚴飾之池中蓮華大如車輪青色青光黃色黃光赤色赤光白色白光微妙香潔舍利弗極樂國土成就如是功德莊嚴又舍利弗彼佛國土常作天樂黃金為地晝夜六時雨天曼陀羅華其土衆生常以清旦各以衣裓盛衆妙華供養他方十萬憶佛即以食時還到本國飯食經行舍利弗極樂國土成就如是功德莊嚴復次舍利弗彼國常有種種奇妙雜色之鳥白鶴孔鸚鵡舍利迦陵頻伽共命之鳥是諸衆鳥晝夜六時出和雅音其音演暢五根五力七菩提分八聖道分如是等法其土衆生聞是音已皆悉念佛念法念僧舍利弗汝勿謂此鳥實是罪報所生所以者何彼佛國土無三惡道舍利弗其佛國土尚無惡道之名何況有實是諸衆鳥皆是阿彌陀佛欲令法音宣流變化所作舍利弗彼佛國土微風吹動諸寶行樹及寶羅網出微妙音譬如百千種樂同時俱作聞是音者自然皆生念佛念法念僧之心舍利弗其佛國土成就如是功德莊嚴舍利弗於汝意云何彼佛何故號阿彌陀舍利弗彼佛光明無量照十方國無所障礙是故號為阿彌陀又舍利弗彼佛壽命及其人民無量無邊阿僧祇劫故名阿彌陀舍利弗阿彌陀佛成佛已來於今十劫又舍利弗彼佛有無量無邊聲聞弟子皆阿羅漢非是算數之所能知諸菩薩衆亦復如是舍利弗彼佛國土成就如是功德莊嚴又舍利弗極樂國土衆生生者皆是阿跋致其中多有一生補處其數甚多非是算數所能知之但可以無量無邊阿僧祇說舍利弗衆生聞者應當發願願生彼國所以者何得與如是諸上善人俱會一處舍利弗不可以少善根福德因緣得生彼國舍利弗若有善男子善女人聞說阿彌陀佛執持名號若一日若二日若三日若四日若五日若六日若七日一心不亂其人臨命終時阿彌陀佛與諸聖衆現在其前是人終時心不顛倒即得往生阿彌陀佛極樂國土舍利弗我見是利故說此言若有衆生聞是說者應當發願生彼國土舍利弗如我今者讚歎阿彌陀佛不可思議功德之利東方亦有阿閦佛須彌相佛大須彌佛須彌光佛妙音佛如是等恆河沙數諸佛各於其國出廣長舌相遍覆三千大千世界說誠實言汝等衆生當信是稱讚不可思議功德一切諸佛所護念經舍利弗南方世界有日月燈佛名聞光佛大𦦨肩佛須彌燈佛無量精進佛如是等恆河沙數諸佛各於其國出廣長舌相遍覆三千大千世界說誠實言汝等衆生當信是稱讚不可思議功德一切諸佛所護念經舍利弗西方世界有無量壽佛無量相佛無量幢佛大光佛大明佛寶相佛淨光佛如是等恆河沙數諸佛各於其國出廣長舌相遍覆三千大千世界說誠實言汝等衆生當信是稱讚不可思議功德一切諸佛所護念經舍利弗北方世界有𦦨肩佛最勝音佛難沮佛日生佛網明佛如是等恆河沙數諸佛各於其國出廣長舌相遍覆三千大千世界說誠實言汝等衆生當信是稱讚不可思議功德一切諸佛所護念經舍利弗下方世界有師子佛名聞佛名光佛達磨佛法幢佛持法佛如是等恆河沙數諸佛各於其國出廣長舌相遍覆三千大千世界說誠實言汝等衆生當信是稱讚不可思議功德一切諸佛所護念經舍利弗上方世界有梵音佛宿王佛香上佛香光佛大𦦨肩佛雜色寶華嚴身佛娑羅樹王佛寶華德佛見一切義佛如須彌山佛如是等恆河沙數諸佛各於其國出廣長舌相遍覆三千大千世界說誠實言汝等衆生當信是稱讚不可思議功德一切諸佛所護念經舍利弗於汝意云何何故名為一切諸佛所護念經舍利弗若有善男子善女人聞是經受持者及聞諸佛名者是諸善男子善女人皆為一切諸佛之所護念皆得不退轉於阿耨多羅三藐三菩提是故舍利弗汝等皆當信受我語及諸佛所說舍利弗若有人已發願今發願當發願欲生阿彌陀佛國者是諸人等皆得不退轉於阿耨多羅三藐三菩提於彼國土若已生若今生若當生是故舍利弗諸善男子善女人若有信者應當發願生彼國土舍利弗如我今者稱讚諸佛不可思議功德彼諸佛等亦稱讚我不可思議功德而作是言釋迦牟尼佛能為甚難希有之事能於娑婆國土五濁惡世劫濁見濁煩惱濁衆生濁命濁中得阿耨多羅三藐三菩提為諸衆生說是一切世間難信之法舍利弗當知我於五濁惡世行此難事得阿耨多羅三藐三菩提為一切世間說此難信之法是為甚難佛說此經已舍利弗及諸比丘一切世間天人阿修羅等聞佛所說歡喜信受作禮而去佛說阿彌陀佛經拔一切業障根本得生淨土陀羅尼往生呪三遍蓮池會三稱提綱鳴尺世界何緣稱極樂只因衆苦不能侵道人若要尋歸路但向塵中了自心心心即佛醍醐酥酪咸自乳生佛佛惟心叉釧瓶盤盡從金出十萬億程東西不隔二六時內凡聖同途低頭合掌白玉毫星明日麗歌咏讚揚紫金容霆震雷轟清涼月兮有水皆含功德雲而無山不戴香象渡河一舉洪名超二死迦陵出千稱嘉號壓羣音下情唯忖以難思一念回光而易往究竟不居心外分明祇在目前審如是即今衆等繫念彌陀三時佛事只如不涉證修親蒙授記一句如何舉揚鳴尺風吟樹樹千般樂香浸池池四色華維那師舉阿彌陀佛身金色相好光明無等倫白毫宛轉五須彌紺目澄清四大海光中化佛無數億化菩薩衆亦無邊四十八願度衆生九品咸令登彼岸南無西方極樂世界大慈大悲阿彌陀佛念佛百聲維那舉讚第一大願觀想彌陀四十八願度娑婆九品湧金波寶網交羅度亡靈出愛河蓮池會三稱講演鳴尺諸苦盡從貪欲起不知貪欲起於何因忘自性彌陀佛異念紛馳總是魔教中道生而無生法性湛然無生而生業果儼然所謂生者即衆生生滅之迹也謂無生者即諸佛寂滅之本也法性湛然者靈明湛寂元妙真常箇箇不無人人本具只因最初不覺忽爾動心認妄為真迷己逐物由是業網牽纏流轉五道恆隨生死以升沈亘古至今而靡閒當知生自緣生而法性不與緣俱生滅自緣滅而法性不與緣俱滅所以云法性湛然是謂生而無生者也無生而生者衆生迷妄入心積業成果虗受輪轉妄見生滅於法性體上如鏡現像似珠隨色當知鏡光本淨珠體絶痕物境互彰不違色像彼色像之去來猶業果之儼然也故諸佛於儼然生滅中唯見無生衆生於湛然無生中唯見生滅只因迷悟之有差遂致現量之不一實乃生無自性無生亦無自性悟則生滅皆無生迷則無生皆生滅所以離此別無是乃一體而異名也審如是則阿彌陀佛即是我心我心即是阿彌陀佛淨土即此方此方即淨土豈非迷悟之自殊何有聖凡而彼此乃知現前衆等以自性阿彌陀與大衆舌根普同運轉根本法輪諸仁還委悉麼生滅無生生不生樂那肯禁人行誰知萬丈紅塵裏菡萏華開月正明維那師舉南無西方極樂世界大慈大悲阿彌陀佛師與大衆齊下座旋繞念佛千聲已至靈前收佛號舉觀音勢至清淨大海衆菩薩各三稱畢念十大願一者禮敬諸佛二者稱讚如來三者廣修供養四者懺悔業障五者隨喜功德六者請轉法輪七者請佛住世八者常隨佛學九者恆順衆生十者普皆回向衆生無邊誓願度煩惱無盡誓願斷法門無量誓願學佛道無上誓願成接讚佛寶讚無窮功成無量劫中巍巍丈六紫金容覺道雪山峰眉際玉毫光燦爛照開六道昏蒙龍華三會願相逢演說法真宗念佛上座鳴尺人人分上本有彌陀箇箇心中總為淨土了則頭頭見佛悟來步步西方上來啓建三時繫念淨業道場今當第一時佛事已圓如上殊勳投入彌陀大願海中專為亡靈某求生淨土但念自從無始迄至今生一念違真六根逐妄隨情造業縱我為非身業則殺盜邪淫口過則妄言綺語兩舌惡口意惡則常起貪瞋深生癡愛由茲三業鉤鎖妄緣常汩汩於塵勞但茫茫於歲月欲思出離唯憑懺悔熏修之力俾眼耳鼻舌身意之過愆應念頓消使色聲香味觸法之浮塵即時清淨又極樂求生全憑發願仰勞法衆異口同音敬為亡靈至心懺悔發願往昔所造諸惡業皆由無始貪瞋癡從身語意之所生今對佛前求懺悔衆生無邊誓願度煩惱無盡誓願斷法門無量誓願學佛道無上誓願成南無普賢王菩薩摩訶薩三稱上來懺悔發願已竟鳴尺亡靈某當知夫淨土之為教也仰承阿彌陀佛四十有八大慈大悲深重願力攝取十方一切衆生凡具信心者皆得往生信者信有西方淨土信有阿彌陀佛攝取衆生之事我等衆生信有往生之分然雖謂彌陀攝取衆生往生要信唯是隨心自現感應道交究竟非從外得如是信者是為真信信而無行即不成其信行者棱嚴經云都攝六根淨念相繼不假方便自得心開阿彌陀經云若有善男子善女人聞說阿彌陀佛執持名號若一日若二日乃至七日一心不亂其人臨命終時阿彌陀佛與諸聖衆現在其前是人終時心不顛倒即得往生阿彌陀佛極樂國土如是行者是名正行行而無願即不成其行願者要與阿彌陀佛四十八願願願相應是為大願也信行願三如鼎三足缺一不可今爾亡靈當知現前一念本自圓常信行願原是自己本來具有如是性德今者但是本性光明顯發耳鳴尺阿彌陀佛無上醫王巍巍金相放毫光苦海作慈航九品蓮同願往西方蓮池會三稱第一時佛事已畢下座第二時師與衆登座定維那師舉南無蓮池海會佛菩薩三稱佛說阿彌陀經接誦阿彌陀經一遍拔一切業障根本得生淨土陀羅尼往生呪三遍蓮池會三稱鳴尺便就今朝成佛去樂化主已嫌遲那堪更欲之乎者管取輪回沒了時原夫遍十方是極樂世界山光水色似空合空盡大地是清泰故鄉華笑鳥啼如鏡照鏡自是不歸歸便得五湖煙景有誰爭黃金臂晝夜常垂惟許行人獨委白玉毫古今不昧全憑願者承當所以道萬法是心光諸緣惟性曉本無迷悟人只要今日了即今現前衆等繫念第二時佛事且了之一句如何舉揚琉璃池上懸明月菡萏華閒戲水禽維那師舉阿彌陀佛身金色相好光明無等倫白毫宛轉五須彌紺目澄清四大海光中化佛無數億化菩薩衆亦無邊四十八願度衆生九品咸令登彼岸南無西方極樂世界大慈大悲阿彌陀佛念佛百聲維那舉讚第一大願觀想彌陀四十八願度娑婆九品湧金波寶網交羅度亡靈出愛河蓮池會三稱講演鳴尺是心是佛將心念念到心空佛亦忘撒手歸來重檢點華開赤白與青黃教中道惟心佛亦爾惟佛衆生然心佛及衆生是三無差別所謂心者心有多種曰肉團心乃現在身中父母血氣所生者是曰緣慮心即現今善惡順逆境界上種種分別者是曰靈知心是混千差而不亂歷三際以靡遷炳然獨照卓爾不羣在聖不增在凡不減處生死流驪珠獨耀于滄海居涅槃岸桂輪孤朗于中天諸佛悟之假名惟心衆生迷之便成妄識是以佛即衆生衆生即佛且心外無佛亦無衆生唯迷悟之有間故凡聖而逈異豈知心佛衆生三無差別永嘉云夢裏明明有六趣覺後空空無大千既然如是則經云從是西方過十萬億佛土有世界名曰極樂其土有佛號阿彌陀今現在說法總不出唯心淨土本性彌陀也由是而知即今現前亡過某其生也蓮華朵朵其歿也行樹重重無一時不達蓮無一念不依慈父審如是且道離此心佛衆生外別有商量處也無大圓鏡裏絶纖埃碧藕華中有聖胎遙望金沙池沼外寶光常照玉樓臺維那師舉南無西方極樂世界大慈大悲阿彌陀佛下座旋繞念佛千聲已至靈前師舉觀音勢至清淨海衆三稱畢念後文十方三世佛阿彌陀第一九品度衆生威德無窮極我今大歸依懺悔三業罪凡有諸福善至心用回向願同念佛人感應隨時現臨終西方境分明在目前見聞皆精進同生極樂國見佛了生死如佛度一切無邊煩惱斷無量法門修誓願度衆生總願成佛道虗空有盡我願無窮願生西方淨土中上品蓮華為父母華開見佛悟無生不退菩薩為伴侶接讚法寶實難量如來金口宣揚龍宮海藏散天香覺者誦琅𪻱玉軸霞條金寫字似排秋雁成行昔因三藏取來唐萬古為敷揚念佛登座鳴尺蓋聞虗而有鳴答之聲寂而無形影之相然谷響自然非呼之而不答佛身無作非扣之而不彰上來啓建第二時繫念佛事已圓如上殊勳投入如來大願海中出生功德專為亡靈某洗除業垢增長善根捨此報緣往生淨土但念自從無始迄至今生漚生巨海逐識浪以高低雲點太清任情風而人我於是循環諸趣流轉四生業海茫茫罪山岌岌匪憑發露曷遂消除懺摩已往發願當來再勞法衆至心懺悔發願往昔所造諸惡業皆由無始貪瞋癡從身語意之所生一切罪障皆懺悔衆生無邊誓願度煩惱無盡誓願斷法門無量誓願學佛道無上誓願成南無普賢王菩薩摩訶薩三稱上來懺悔發願已竟具行猶人具眼目願如日月燈光明依光照燭見分明行者方能達前境是以念佛之人若不發願往生縱有功行亦成虗設以不順佛故今爾亡靈當知此意阿彌陀佛無上醫王巍巍金相放毫光苦海作慈航九品蓮同願往西方蓮池會三稱第三時師與衆登座定維那師舉南無蓮池海會佛菩薩三稱佛說阿彌陀經接誦阿彌陀經一遍拔一切業障根本得生淨土陀羅尼接往生呪三遍念蓮池會三稱鳴尺十萬餘程不隔塵休將迷悟自疏親剎那念盡恆沙佛便是蓮華國裏人合塵背覺栽荊棘於七寶園林捨妄歸真列珠網於四生門戶縱橫萬法圓裹一心非思量處阿彌陀佛坐斷六根無造作時清泰故鄉橫吞八極破羣昏如杲日麗天療衆病如善見神藥所以云一稱阿彌陀佛名號能滅八萬億劫生死衆苦利益如是豈譬喻言說之可及乎只如即今繫念第三時佛事且道現前衆等同聲相應一句如何指陳一從佛向舌根念不覺華隨足底生維那師舉阿彌陀佛身金色相好光明無等倫白毫宛轉五須彌紺目澄清四大海光中化佛無數億化菩薩衆亦無邊四十八願度衆生九品咸令登彼岸南無西方極樂世界大慈大悲阿彌陀佛念佛百聲維那舉讚第一大願觀想彌陀四十八願度娑婆九品湧金波寶網交羅度亡靈出愛河蓮池會三稱講演鳴尺打破虗空笑滿腮玲瓏寶藏豁然開直饒空劫生前事六字洪名畢竟該古人道清珠投於濁水濁水不得不清念佛投於亂心亂心不得不佛西天有寶名曰清珠謂此珠投入濁水中入水一寸則一寸之濁水即便清潔此珠入水自寸至尺乃至於底則濁水亦隨之而澄湛當知清珠者喻念佛之淨念也濁水者喻雜亂之妄心也當妄心雜亂之頃能舉起一念如對慈尊按定六字洪名一一出口入耳則此雜亂自然隨念寂靜自是一念而至十念乃至念念不移即教中所謂淨念相繼者也念佛之人須要信心懇切正因凜然重念死生輪轉之可悲深厭塵勞紛擾為可痛舉起一聲佛名直下更無異見如太阿劍橫按當軒如大火輪星騰𦦨熾萬物攖之則燎觸之則傷直至一心不亂能所兩忘到家之說不容再舉捷徑之詞何勞挂齒可謂證修行之神術超方便之正途破死生蟄戶之雷霆燭迷妄幽衢之日月今宵三時繫念佛事將圓亡靈某承茲上善決定往生且道一念未萌以前還有者箇消息也無鳴尺是心空寂念何依故國云歸孰未歸花外玉雞啼曉日遠迎新佛奉慈威維那師舉南無西方極樂世界大慈大悲阿彌陀佛下座旋繞念佛千聲已至靈前師舉觀音勢至清淨海衆三稱畢念後文一心歸命極樂世界阿彌陀佛願以淨光照我慈誓攝我我今正念稱如來名為菩提道求生淨土佛昔本誓若有衆生欲生我國志心信樂乃至十念若不生者不取正覺以此念佛因緣得入如來大誓海中承佛慈力衆罪消滅善根增長若臨命終自知時至身無病苦心不貪戀意不顛倒如入禪定佛及聖衆手執金臺來迎接我於一念頃生極樂國花開見佛即聞佛乘頓開佛慧廣度衆生滿菩提願念佛臨終見寶臺寶幡寶蓋滿空排彌陀勢至觀音等合掌相隨歸去來僧寶不思議身披三事雲衣浮杯過海剎那時赴感應羣機堪作人天功德主堅持戒行無違我今稽首願遙知振錫杖提攜念佛登座鳴尺念佛既從心出結業豈屬外來須臾背念佛之心剎那即結業之所今則衆等依憑教法作三時繫念佛事所集勝因專為亡靈某決生淨土自今戒香馥慧炬營煌迷雲開而性天獨朗妄塵盡而心地廓通諸根圓淨羣業頓空一舉念一華開挹露迎風香浮玉沼一馳情一果熟含煙對日影落金園經行坐臥在其中游戲逍遙非分外得佛受用徹法源底常寂光處處現前大願王塵塵契會更為亡靈至心懺悔發願往昔所造諸惡業皆由無始貪瞋癡從身語意之所生一切罪根皆懺悔自性衆生誓願度自性煩惱誓願斷自性法門誓願學自性佛道誓願成南無普賢王菩薩摩訶薩三稱上來三時繫念阿彌陀佛萬德洪名勸導亡靈某懺除結業發願往生行願既深功無虗棄惟願亡靈聞斯法要信受奉行從是托質蓮胎永離業海直證阿跋致圓滿無上菩提彌陀佛大願王慈悲喜捨難量眉閒常放白毫光度衆生極樂八德池中蓮九品七寶妙樹成行如來聖號若宣揚接引往西方彌陀聖號若稱揚同願往西方繫念功德殊勝行無邊勝福皆回向普願沈溺諸衆生速往無量光佛剎十方三世一切佛一切菩薩摩訶薩摩訶般若波羅蜜自歸依佛當願衆生紹隆佛種發無上心自歸依法當願衆生深入經藏智慧如海自歸依僧當願衆生統理大衆一切無礙和南聖衆
